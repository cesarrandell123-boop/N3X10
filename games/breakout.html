<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Breaker</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0f17;
        color: #f3f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 14px;
        gap: 10px;
      }
      .hud {
        width: 100%;
        max-width: 720px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 20px; font-size: 14px; color: #a1acbf; }
      .stats strong { color: #f3f5f9; margin-left: 6px; font-size: 16px; }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #131a27;
        color: #f3f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button.primary {
        background: #f59e0b;
        color: #0b0f17;
        border-color: #f59e0b;
      }
      .stage {
        position: relative;
        width: min(720px, 95vw);
        aspect-ratio: 4 / 3;
        max-height: 78vh;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
        background: #0f1623;
      }
      canvas { width: 100%; height: 100%; display: block; }
      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(11, 15, 23, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        gap: 12px;
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 26px; }
      .overlay p { margin: 0; color: #a1acbf; font-size: 14px; max-width: 34ch; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hud">
        <div class="stats">
          <span>Score<strong id="scoreVal">0</strong></span>
          <span>Lives<strong id="livesVal">3</strong></span>
          <span>Level<strong id="levelVal">1</strong></span>
        </div>
        <button type="button" id="muteBtn">Sound On</button>
      </div>

      <div class="stage">
        <canvas id="canvas" width="720" height="540"></canvas>
        <div class="overlay" id="overlay">
          <h1 id="overlayTitle">Brick Breaker</h1>
          <p id="overlayDesc">Move your mouse or use Left/Right arrows to deflect the ball and clear every brick.</p>
          <button type="button" class="primary" id="startBtn">Start Game</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('scoreVal');
      const livesEl = document.getElementById('livesVal');
      const levelEl = document.getElementById('levelVal');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const overlayDesc = document.getElementById('overlayDesc');
      const startBtn = document.getElementById('startBtn');
      const muteBtn = document.getElementById('muteBtn');

      const ROW_COLORS = ['#ea580c', '#f59e0b', '#eab308', '#10b981', '#0ea5e9'];
      let muted = false;
      let audioCtx = null;
      let state = 'TITLE';
      let score = 0;
      let lives = 3;
      let level = 1;
      let keys = { left: false, right: false };

      const paddle = { w: 112, h: 14, x: 304, y: 500, speed: 520 };
      const ball = { x: 360, y: 480, r: 8, vx: 230, vy: -300 };
      let bricks = [];

      function beep(freq, dur) {
        if (muted) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + dur);
        } catch {}
      }

      function buildBricks() {
        bricks = [];
        const cols = 10;
        const rows = 5;
        const pad = 8;
        const offsetX = 28;
        const offsetY = 54;
        const bw = (canvas.width - offsetX * 2 - pad * (cols - 1)) / cols;
        const bh = 22;

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            bricks.push({
              x: offsetX + c * (bw + pad),
              y: offsetY + r * (bh + pad),
              w: bw,
              h: bh,
              color: ROW_COLORS[r],
              alive: true
            });
          }
        }
      }

      function resetBall() {
        paddle.x = (canvas.width - paddle.w) / 2;
        ball.x = canvas.width / 2;
        ball.y = paddle.y - 16;
        const speedBoost = 1 + (level - 1) * 0.1;
        ball.vx = (Math.random() > 0.5 ? 1 : -1) * 230 * speedBoost;
        ball.vy = -310 * speedBoost;
      }

      function startGame() {
        score = 0;
        lives = 3;
        level = 1;
        scoreEl.textContent = '0';
        livesEl.textContent = '3';
        levelEl.textContent = '1';
        buildBricks();
        resetBall();
        state = 'PLAYING';
        overlay.hidden = true;
      }

      function update(dt) {
        if (state !== 'PLAYING') return;

        if (keys.left) paddle.x -= paddle.speed * dt;
        if (keys.right) paddle.x += paddle.speed * dt;
        paddle.x = Math.max(8, Math.min(canvas.width - paddle.w - 8, paddle.x));

        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        if (ball.x - ball.r < 0) {
          ball.x = ball.r;
          ball.vx = Math.abs(ball.vx);
          beep(300, 0.05);
        } else if (ball.x + ball.r > canvas.width) {
          ball.x = canvas.width - ball.r;
          ball.vx = -Math.abs(ball.vx);
          beep(300, 0.05);
        }

        if (ball.y - ball.r < 0) {
          ball.y = ball.r;
          ball.vy = Math.abs(ball.vy);
          beep(300, 0.05);
        }

        if (
          ball.vy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x - 4 &&
          ball.x <= paddle.x + paddle.w + 4
        ) {
          const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          const speed = Math.hypot(ball.vx, ball.vy);
          const angle = hit * (Math.PI / 3);
          ball.vx = speed * Math.sin(angle);
          ball.vy = -Math.abs(speed * Math.cos(angle));
          ball.y = paddle.y - ball.r;
          beep(440, 0.07);
        }

        for (const b of bricks) {
          if (!b.alive) continue;
          if (
            ball.x + ball.r > b.x &&
            ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y &&
            ball.y - ball.r < b.y + b.h
          ) {
            b.alive = false;
            ball.vy = -ball.vy;
            score += 20;
            scoreEl.textContent = String(score);
            beep(620, 0.06);
            break;
          }
        }

        if (bricks.every((b) => !b.alive)) {
          level += 1;
          levelEl.textContent = String(level);
          buildBricks();
          resetBall();
          beep(780, 0.14);
        }

        if (ball.y - ball.r > canvas.height) {
          lives -= 1;
          livesEl.textContent = String(lives);
          beep(150, 0.22);
          if (lives <= 0) {
            state = 'GAME_OVER';
            overlayTitle.textContent = `Game Over · ${score}`;
            overlayDesc.textContent = `Reached Level ${level}. Ready for another round?`;
            startBtn.textContent = 'Play Again';
            overlay.hidden = false;
          } else {
            resetBall();
          }
        }
      }

      function draw() {
        ctx.fillStyle = '#0f1623';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const b of bricks) {
          if (!b.alive) continue;
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 4);
          ctx.fill();
        }

        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      let last = performance.now();
      function loop(now) {
        const dt = Math.min(0.03, (now - last) / 1000 || 0);
        last = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener('pointermove', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const mx = (e.clientX - rect.left) * scaleX;
        paddle.x = Math.max(8, Math.min(canvas.width - paddle.w - 8, mx - paddle.w / 2));
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      });
      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
      });

      startBtn.addEventListener('click', startGame);
      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? 'Sound Off' : 'Sound On';
      });

      requestAnimationFrame(loop);
    </script>
  </body>
</html>
